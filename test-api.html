<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 48px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.6);
        }

        h1 {
            text-align: center;
            margin-bottom: 48px;
            color: #ffffff;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 16px;
            letter-spacing: -0.2px;
        }

        .token-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .token-input-group {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .token-input {
            flex: 1;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 13px;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.3);
            color: #e5e5e5;
            resize: vertical;
            min-height: 120px;
            line-height: 1.5;
            transition: all 0.2s ease;
        }

        .token-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }

        .token-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .button {
            background: linear-gradient(135deg, #2a2a2a 0%, #1f1f1f 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            letter-spacing: -0.1px;
        }

        .button:hover {
            background: linear-gradient(135deg, #333333 0%, #282828 100%);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .primary-button {
            background: linear-gradient(135deg, #404040 0%, #353535 100%);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .primary-button:hover {
            background: linear-gradient(135deg, #4a4a4a 0%, #3f3f3f 100%);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .modal-section {
            display: flex;
            justify-content: center;
        }

        .payment-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: -0.1px;
        }

        .preset-addresses {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .address-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .address-item:hover {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .address-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .address-name {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
        }

        .address-value {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
        }

        .small-button {
            padding: 10px 16px;
            font-size: 12px;
        }
    </style>
</head>

    <script>
        function claimToken() {
            const tokenInput = document.getElementById('cashu-token');
            const token = tokenInput.value.trim();
            
            if (!token) {
                alert('Please enter a token to claim');
                return;
            }
            
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            
            // Add claim logic here when available in the extension API
            console.log('Claiming token:', token);
            alert('Token claim functionality will be implemented');
        }

        function openModal() {
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            window._cashu.popup();
        }

        async function payLightning(propAddress) {
            const address = propAddress || document.getElementById('lightning-address').value.trim();
            
            if (!address) {
                alert('Please enter a Lightning address');
                return;
            }
            
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            
            try {
                const result = await window._cashu.payLightningAddress(address);
                console.log('Payment result:', result);
            } catch (error) {
                alert('Payment failed: ' + error.message);
                console.error('Payment error:', error);
            }
        }

        async function payPresetAddress(address) {
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            
            try {
                const result = await window._cashu.payLightningAddress(address);
                console.log('Payment result:', result);
                alert('Payment initiated for ' + address);
            } catch (error) {
                alert('Payment failed: ' + error.message);
                console.error('Payment error:', error);
            }
        }
    </script>
