<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashu Extension Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 48px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.6);
        }

        h1 {
            text-align: center;
            margin-bottom: 48px;
            color: #ffffff;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 16px;
            letter-spacing: -0.2px;
        }

        .token-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .token-input-group {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .token-input {
            flex: 1;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 13px;
            padding: 16px 80px 16px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.3);
            color: #e5e5e5;
            resize: vertical;
            min-height: 120px;
            line-height: 1.5;
            transition: all 0.2s ease;
        }

        .token-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }

        .token-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .claim-button {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: linear-gradient(135deg, #404040 0%, #353535 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            letter-spacing: -0.1px;
            z-index: 10;
        }

        .claim-button:hover {
            background: linear-gradient(135deg, #4a4a4a 0%, #3f3f3f 100%);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .claim-button:active {
            transform: translateY(0);
        }

        .button {
            background: linear-gradient(135deg, #2a2a2a 0%, #1f1f1f 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            letter-spacing: -0.1px;
        }

        .button:hover {
            background: linear-gradient(135deg, #333333 0%, #282828 100%);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .primary-button {
            background: linear-gradient(135deg, #404040 0%, #353535 100%);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .primary-button:hover {
            background: linear-gradient(135deg, #4a4a4a 0%, #3f3f3f 100%);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .modal-section {
            display: flex;
            justify-content: center;
        }

        .payment-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            width: 100%;

            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: -0.1px;
        }

        .preset-addresses {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .address-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .address-item:hover {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .address-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .address-name {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
        }

        .address-value {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
        }

        .small-button {
            padding: 10px 16px;
            font-size: 12px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 12px;
            justify-content: flex-end;
        }

        .button-group .button {
            flex-shrink: 0;
        }

        .comment-input-inline {
            margin-top: 8px;
            width: 100%;
        }

        .comment-input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .comment-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }

        .comment-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cashu Extension Test</h1>

        <div class="section">
            <div class="section-title">Extension Control</div>
            <div class="modal-section">
                <button class="button" onclick="openModal()">Open Extension</button>
            </div>
        </div>

        <div class="section">
          <div class="section-title">Token Management</div>
          <div class="token-section">
              <div class="token-input-group">
                  <textarea 
                      class="token-input" 
                      id="cashu-token" 
                      placeholder="Enter your Cashu token here..."
                  ></textarea>
                  <button class="claim-button" onclick="claimToken()">Claim</button>
              </div>
          </div>
      </div>
        
        <div class="section">
            <div class="section-title">Custom Lightning Payment</div>
            <div class="payment-section">
                <div class="input-group">
                    <div style="flex: 1;">
                        <label class="label" for="lightning-address">Lightning Address</label>
                        <input 
                            type="text" 
                            class="input-field" 
                            id="lightning-address" 
                            placeholder="satoshi@gmx.com"
                        >
                    </div>
                    <button class="button primary-button" onclick="payLightning()">Pay</button>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Quick Pay Examples</div>
            <div class="preset-addresses">
                                <div class="address-item">
                    <div class="address-info">
                        <div class="address-name">Calle</div>
                        <div class="address-value">calle@npub.cash</div>
                        <div class="comment-input-inline">
                            <input 
                                type="text" 
                                class="comment-input" 
                                id="calle-comment" 
                                placeholder="Add a comment (optional)..."
                            >
                        </div>
                        <div class="button-group">
                            <button class="button small-button" onclick="payLightningWithCommentIfProvided('calle@npub.cash')">Pay</button>
                            <button class="button small-button primary-button" onclick="payLightningWithAmountAndCommentIfProvided('calle@npub.cash', 42)">42 sats</button>
                        </div>
                    </div>
                </div>
                
                <div class="address-item">
                    <div class="address-info">
                        <div class="address-name">KELBIE</div>
                        <div class="address-value">quiethorse9@primal.net</div>
                        <div class="comment-input-inline">
                            <input 
                                type="text" 
                                class="comment-input" 
                                id="kelbie-comment" 
                                placeholder="Add a comment (optional)..."
                        >
                        </div>
                        <div class="button-group">
                            <button class="button small-button" onclick="payLightningWithCommentIfProvided('quiethorse9@primal.net')">Pay</button>
                            <button class="button small-button primary-button" onclick="payLightningWithAmountAndCommentIfProvided('quiethorse9@primal.net', 42)">42 sats</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function claimToken() {
            const tokenInput = document.getElementById('cashu-token');
            const token = tokenInput.value.trim();
            
            if (!token) {
                alert('Please enter a token to claim');
                return;
            }
            
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            
            window._cashu.claimToken(token);
        }

        function openModal() {
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            window._cashu.popup();
        }

        async function payLightning(propAddress) {
            const address = propAddress || document.getElementById('lightning-address').value.trim();
            
            if (!address) {
                alert('Please enter a Lightning address');
                return;
            }
            
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            
            try {
                const result = await window._cashu.payLightningAddress(address);
                console.log('Payment result:', result);
            } catch (error) {
                alert('Payment failed: ' + error.message);
                console.error('Payment error:', error);
            }
        }

        async function payLightningWithAmount(address, amount) {
            if (!address) {
                alert('Please provide a Lightning address');
                return;
            }
            
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            
            try {
                const result = await window._cashu.payLightningAddressWithAmount(address, amount);
                console.log('Payment with amount result:', result);
            } catch (error) {
                alert('Payment failed: ' + error.message);
                console.error('Payment error:', error);
            }
        }

        async function payLightningWithComment(address, comment) {
            if (!address) {
                alert('Please provide a Lightning address');
                return;
            }
            
            if (!comment) {
                alert('Please provide a comment');
                return;
            }
            
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            
            try {
                const result = await window._cashu.payLightningAddressWithCommentOnly(address, comment);
                console.log('Payment with comment result:', result);
            } catch (error) {
                alert('Payment failed: ' + error.message);
                console.error('Payment error:', error);
            }
        }

        async function payLightningWithAmountAndComment(address, amount, comment) {
            if (!address) {
                alert('Please provide a Lightning address');
                return;
            }
            
            if (!amount || amount <= 0) {
                alert('Please provide a valid amount');
                return;
            }
            
            if (!comment) {
                alert('Please provide a comment');
                return;
            }
            
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            
            try {
                const result = await window._cashu.payLightningAddressWithAmount(address, amount, comment);
                console.log('Payment with amount and comment result:', result);
            } catch (error) {
                alert('Payment failed: ' + error.message);
                console.error('Payment error:', error);
            }
        }

        async function payLightningWithCommentIfProvided(address) {
            if (!address) {
                alert('Please provide a Lightning address');
                return;
            }
            
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            
            // Get the comment from the appropriate input based on the address
            let comment = '';
            if (address === 'quiethorse9@primal.net') {
                comment = document.getElementById('kelbie-comment').value.trim();
            } else if (address === 'calle@npub.cash') {
                comment = document.getElementById('calle-comment').value.trim();
            }
            
            try {
                if (comment) {
                    const result = await window._cashu.payLightningAddressWithCommentOnly(address, comment);
                    console.log('Payment with comment result:', result);
                } else {
                    const result = await window._cashu.payLightningAddress(address);
                    console.log('Payment result:', result);
                }
            } catch (error) {
                alert('Payment failed: ' + error.message);
                console.error('Payment error:', error);
            }
        }

        async function payLightningWithAmountAndCommentIfProvided(address, amount) {
            if (!address) {
                alert('Please provide a Lightning address');
                return;
            }
            
            if (!amount || amount <= 0) {
                alert('Please provide a valid amount');
                return;
            }
            
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            
            // Get the comment from the appropriate input based on the address
            let comment = '';
            if (address === 'quiethorse9@primal.net') {
                comment = document.getElementById('kelbie-comment').value.trim();
            } else if (address === 'calle@npub.cash') {
                comment = document.getElementById('calle-comment').value.trim();
            }
            
            try {
                if (comment) {
                    const result = await window._cashu.payLightningAddressWithAmount(address, amount, comment);
                    console.log('Payment with amount and comment result:', result);
                } else {
                    const result = await window._cashu.payLightningAddressWithAmountOnly(address, amount);
                    console.log('Payment with amount only result:', result);
                }
            } catch (error) {
                alert('Payment failed: ' + error.message);
                console.error('Payment error:', error);
            }
        }

        async function payPredefinedAmountOnly() {
            const address = document.getElementById('predefined-address').value.trim();
            const amount = parseInt(document.getElementById('predefined-amount').value);
            
            if (!address) {
                alert('Please enter a Lightning address');
                return;
            }
            
            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }
            
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            
            try {
                const result = await window._cashu.payLightningAddressWithAmountOnly(address, amount);
                console.log('Amount only payment result:', result);
            } catch (error) {
                alert('Payment failed: ' + error.message);
                console.error('Payment error:', error);
            }
        }

        async function payPredefinedCommentOnly() {
            const address = document.getElementById('predefined-address').value.trim();
            const comment = document.getElementById('predefined-comment').value.trim();
            
            if (!address) {
                alert('Please enter a Lightning address');
                return;
            }
            
            if (!comment) {
                alert('Please enter a comment');
                return;
            }
            
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            
            try {
                const result = await window._cashu.payLightningAddressWithCommentOnly(address, comment);
                console.log('Comment only payment result:', result);
            } catch (error) {
                alert('Payment failed: ' + error.message);
                console.error('Payment error:', error);
            }
        }

        async function payPredefinedAmountAndComment() {
            const address = document.getElementById('predefined-address').value.trim();
            const amount = parseInt(document.getElementById('predefined-amount').value);
            const comment = document.getElementById('predefined-comment').value.trim();
            
            if (!address) {
                alert('Please enter a Lightning address');
                return;
            }
            
            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }
            
            if (typeof window._cashu === 'undefined') {
                alert('Cashu extension not detected');
                return;
            }
            
            try {
                const result = await window._cashu.payLightningAddressWithAmount(address, amount, comment);
                console.log('Amount and comment payment result:', result);
            } catch (error) {
                alert('Payment failed: ' + error.message);
                console.error('Payment error:', error);
            }
        }
    </script>
</body>
</html>
